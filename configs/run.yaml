# End-to-end pipeline settings (`aerialrange run`). Each value cites its source.
detector:
  value: {kind: dfine, weights: weights/dfine_n_640.onnx, imgsz: 640, score_floor: 0.1}
  placeholder: null
  source: "Version 2 detector (D-729): D-FINE N trained on VisDrone at 640, run through ONNX Runtime in the project's code (parity D-722). Score floor 0.1 as in tracking (D-319). kind: yolo runs version 1's detector export (D-721, reference only); kind: rfdetr an RF-DETR export (D-719); kind: boxes reads boxes from a CSV (synthetic demo)"
tracker:
  value: {config: configs/trackers/motion_dfine_n_640_by_group.yaml, gmc_downscale: 8, det_stride: 2}
  placeholder: null
  source: "The project's own tracker (D-713) with thresholds per class group chosen for this detector on validation (D-733: people for recall, vehicles for identity; the single pair of D-729 was used for the one-time test), camera-motion compensation at 1/8 (D-609), detection on every 2nd frame (D-610). On a Pi 5 the detector alone is estimated at about 285 ms (D-723), so the stride for the device is set from its measurement (make pi-benchmark)"
camera:
  value: {focal_px: 1259, cx: 960, cy: 540}
  placeholder: null
  source: "AU-AIR camera model (D-509); principal point assumed at the image centre (docs/auair_camera_model.md). Another camera needs its own values"
range_sigma_rel_by_depression:
  value: {edges_deg: [0, 10, 20, 40, 60, 91], rel: [0.217, 0.099, 0.125, 0.074, 0.038]}
  placeholder: null
  source: "Range sigma = rel x slant range by line-of-sight depression band: the all-flight relative repeatability of stationary vehicles on the AU-AIR calibration recordings (results/auair/repeatability_view_calibration_B2_yolo26n_960.json, D-517). Empirical, not a propagated model; held-out values were similar (7.6 % overall)"
reliable_max_rel_sigma:
  value: 0.10
  placeholder: REL_UNC_THRESHOLD
  source: "A range is 'uncertain' when sigma / range exceeds 10 %, the large-error threshold (err_threshold_frac, D-314); 'invalid' when no ground point exists (no tilt, at or above the horizon)"
kalman:
  value: {q: 7.0, meas_rel_sigma: [0.0082, 0.0039, 0.0022, 0.0019, 0.0035], max_unseen_frames: 30, meas_model: propagated, meas_sigma: {kappa_u: {person: 0.1231, vehicle: 0.0473}, kappa_v: {person: 0.0886, vehicle: 0.0575}, tilt_deg: 1.58, h_m: 1.816, yaw_deg: 0.0}, motion_model: {person: imm, vehicle: cv}, imm: {person: {q_cv: 0.01799, q_ct: 0.01172, q_turn: 0.01815, turn_rate_sigma0: 0.3507, switch_rates: [[0.0, 0.08727, 0.0], [0.01649, 0.0, 0.4405], [0.0002926, 2.43, 0.0]], mode0: [0.152383, 0.71756, 0.130057], velocity_sigma_moving: 0.9297, q_stationary: 0.1, gate_prob: 0.999, reset_after: 2}}}
  placeholder: null
  source: "Speed filter of D-735. Measurement errors propagated through the viewing geometry (geometry/ground_cov.py): box noise kappa per group from results/visdrone/val/pixel_noise_dfine_n_640.json (sigma_u = kappa_u x width, sigma_v = kappa_v x height); tilt sigma 1.58 deg, the median per-frame tilt uncertainty on AU-AIR (a per-frame tilt_sigma_deg in the flight data replaces it); height sigma 1.816 m, the altimeter residual of the AU-AIR calibration recordings (D-508); heading error not measured, 0. Motion: people use the IMM (stationary, constant velocity, coordinated turn) with motion settings fitted on SynDrone development truth (results/syndrone/development/imm_fit.json) and gate 0.999, reset after 2 rejections, q_stationary 0.1 m^2/s, chosen on development and confirmed on the calibration towns; vehicles use the constant-velocity filter, q = KALMAN_Q (D-518), because the IMM made moving vehicles worse (D-735). meas_rel_sigma (version 1, D-518) applies only with meas_model: relative. A filter is dropped after 30 frames unseen, the tracker's track_buffer"
overlay:
  value: {rings_m: [10, 25, 50, 100], font_scale: 0.6}
  placeholder: null
  source: "Display only: faint ground distance rings around the point below the drone"
speed_display:
  value: {sigma_max_ms: null, min_age: null, nis_window: 10, nis_conf: 0.95}
  placeholder: SPEED_SIGMA_MAX
  source: "sigma_max_ms and min_age (updates) fitted on SynDrone development towns 2026-11-06: no setting meets the target (90 % of shown speeds within 0.5 m/s) with the version 1 filter, so both stay null and no speed is displayed; refit after Phase 9.2/9.3 (D-710, results/syndrone/development/speed_display_fit_v1_accurate.json). nis_window 10 updates and a two-sided 95 % chi-square band: the standard time-averaged NIS test (Bar-Shalom, Li and Kirubarajan, 2001)"
