[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerialrange"
version = "0.0.1"
description = "Aerial multi-object tracking with ground-plane ranging, uncertainty and a CPU latency budget."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "typer",
    "h5py",
    "pillow",
    "matplotlib",
    "pandas",
    "motmetrics",
    "opencv-python-headless",
    "onnxruntime",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pymap3d"]  # pymap3d: test reference only
edge = ["onnx", "onnxslim"]  # model export and quantisation tools

[project.scripts]
aerialrange = "aerialrange.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aerialrange.viz" = ["map_viewer.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN"]
# N802/N803/N806: allow R_wb, K and similar frame-named variables.
# ANN401: config values are dynamically typed YAML.
ignore = ["N802", "N803", "N806", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
