name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    # Synthetic data only: no datasets, no GPU.
    # 3.12 as developed; 3.13 as on Raspberry Pi OS Trixie (Debian 13 python3 3.13.5, D-762)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-lock.txt
          .venv/bin/python -m pip install -e . --no-deps
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  arm64-container:
    # Every run-time dependency must install on ARM64 (Raspberry Pi 5): build the image for
    # linux/arm64 under QEMU and run the synthetic demo and the tests in it. No model weights
    # in CI; the comparison with real frames is `make platform-check` (docs/edge.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/arm64)
        run: docker buildx build --platform linux/arm64 -f docker/Dockerfile -t aerialrange:arm64 --load .
      - name: Demo in the ARM64 image
        run: docker run --rm --platform linux/arm64 aerialrange:arm64 aerialrange demo --out /tmp/demo
